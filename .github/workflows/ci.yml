name: CI

# Run the full quality gate on every PR and every push to dev/main.
# PRs: validates the branch before merge.
# Pushes to dev/main: catches regressions on the integration/stable lines.
#
# Order: check (fmt) -> lint -> build -> test.
# Format check first — cheapest, most mechanical signal; then lint;
# then a build/boot smoke check; then the test suite.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  server:
    name: Check, lint, build & test (server)
    runs-on: ubuntu-latest

    # Integration tests need a real MongoDB. This service container matches
    # the local dev setup (docker run -d -p 27017:27017 mongo:7).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (oxfmt)
        run: npm run fmt:check

      - name: Lint (oxlint)
        run: npm run lint

      # Build = the app must boot and serve a request. There is no compile
      # step (JS only), so we smoke-test startup over HTTPS with dev certs.
      - name: Build (boot & HTTPS smoke check)
        run: |
          npm run generate-cert
          cp .env.example .env
          # Point MONGODB_URI at the CI mongo service container (same one the
          # tests use) and enable the HTTPS cert paths — never Atlas, never secrets.
          sed -i 's|^MONGODB_URI=.*|MONGODB_URI=mongodb://localhost:27017/studyswap-ci|' .env
          sed -i 's|^# HTTPS_KEY_PATH=|HTTPS_KEY_PATH=|' .env
          sed -i 's|^# HTTPS_CERT_PATH=|HTTPS_CERT_PATH=|' .env
          node src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -skf https://localhost:3000/api/health > /dev/null 2>&1; then
              echo "HTTPS health check passed"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to boot/serve over HTTPS"
          kill $SERVER_PID 2>/dev/null
          exit 1

      - name: Test (vitest)
        env:
          # Points at the service container above — never Atlas, never secrets.
          MONGODB_URI: mongodb://localhost:27017/studyswap-ci
          JWT_SECRET: ci-only-secret
        run: npm test
