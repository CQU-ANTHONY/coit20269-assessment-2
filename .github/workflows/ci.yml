name: CI

# Run the full quality gate on every PR and every push to dev/main.
# PRs: validates the branch before merge.
# Pushes to dev/main: catches regressions on the integration/stable lines.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  server:
    name: Lint, format check & test (server)
    runs-on: ubuntu-latest

    # Integration tests need a real MongoDB. This service container matches
    # the local dev setup (docker run -d -p 27017:27017 mongo:7).
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run fmt:check

      - name: Test (vitest)
        env:
          # Points at the service container above — never Atlas, never secrets.
          MONGODB_URI: mongodb://localhost:27017/studyswap-ci
          JWT_SECRET: ci-only-secret
        run: npm test
