<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>StudySwap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#11111b">
    <meta name="color-scheme" content="dark">
    <!-- Cordova: self + HTTPS API + camera data URLs / blobs. gap: for Cordova bridge. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: content: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; media-src *;">
    <link rel="stylesheet" href="lib/css/jquery.mobile-1.4.5.min.css">
    <link rel="stylesheet" href="css/studyswap.css">
</head>
<body>

<!--
  Page markup lives in components/*.html and is mounted by js/boot.js before
  jQuery Mobile enhances the DOM (autoInitializePage is false below).
-->

<!-- cordova.js is injected at build/run time (gitignored). Load before jQuery. -->
<script src="cordova.js"></script>
<script src="lib/jquery-2.2.4.min.js"></script>
<script>
    // jQuery Mobile 1.4.5 + jQuery 2.x compatibility: jQM must not bind to
    // page load events that conflict with Cordova. Keep defaults for browser.
    // Delay enhance until boot.js has injected page components.
    $(document).on('mobileinit', function () {
        $.mobile.defaultPageTransition = 'fade';
        $.mobile.autoInitializePage = false;
    });
</script>
<script src="lib/jquery.mobile-1.4.5.min.js"></script>
<script src="js/boot.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
<script src="js/signup.js"></script>
<script src="js/browse.js"></script>
<script src="js/detail.js"></script>
<script src="js/profile.js"></script>
<script src="js/form.js"></script>
</body>
</html>
